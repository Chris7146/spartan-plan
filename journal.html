<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Spartan Journal">
    <meta name="theme-color" content="#0e1412">
    <title>Spartan Journal</title>

    <style>
        :root {
            --bg-primary: #0e1412;
            --bg-secondary: #1a2420;
            --bg-tertiary: #243530;
            --accent: #e63946;
            --accent-secondary: #22c980;
            --accent-warn: #f0a500;
            --text-primary: #e8ede9;
            --text-secondary: #b0b9b3;
            --text-muted: #6b7c72;
            --border: rgba(255,255,255,0.08);
            --border-light: rgba(255,255,255,0.12);
            --safe-area-bottom: max(env(safe-area-inset-bottom), 16px);

            --color-recovery: #22c980;
            --color-hyrox: #f0a500;
            --color-grip: #e63946;
            --color-cardio: #4a9eff;
            --color-force: #9b59b6;
            --color-cardio-z2: #1abc9c;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: -apple-system, 'SF Pro Display', BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        .app { display: flex; flex-direction: column; height: 100vh; width: 100%; }

        /* Header */
        .header {
            background: linear-gradient(135deg, rgba(230,57,70,0.1) 0%, rgba(34,201,128,0.05) 100%);
            padding: max(env(safe-area-inset-top), 12px) 16px 12px;
            border-bottom: 1px solid var(--border);
            backdrop-filter: blur(20px);
            z-index: 10;
        }

        .header-row { display: flex; align-items: center; justify-content: space-between; }
        .header-title { font-size: 24px; font-weight: 700; letter-spacing: -0.5px; }
        .header-subtitle { font-size: 13px; color: var(--text-secondary); margin-top: 2px; }
        .header-link {
            font-size: 13px; color: var(--accent); text-decoration: none;
            padding: 6px 12px; border-radius: 16px;
            background: rgba(230,57,70,0.15); border: 1px solid rgba(230,57,70,0.3);
            font-weight: 600;
        }

        /* Week Nav */
        .week-nav {
            display: flex; gap: 6px; overflow-x: auto; padding: 10px 16px;
            border-bottom: 1px solid var(--border);
            -webkit-overflow-scrolling: touch; scroll-behavior: smooth;
        }
        .week-nav::-webkit-scrollbar { height: 0; }

        .week-pill {
            padding: 7px 14px; border-radius: 18px; background: var(--bg-secondary);
            border: 1px solid var(--border); color: var(--text-secondary);
            cursor: pointer; white-space: nowrap; font-size: 12px; font-weight: 600;
            transition: all 0.2s; flex-shrink: 0; touch-action: manipulation;
        }
        .week-pill:active { transform: scale(0.97); }
        .week-pill.active { background: var(--accent); color: var(--bg-primary); border-color: var(--accent); }
        .week-pill .week-progress {
            font-size: 10px; opacity: 0.8; margin-left: 4px;
        }

        /* Content */
        .content {
            flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch;
            padding: 16px 16px calc(16px + var(--safe-area-bottom));
        }

        /* Day Card */
        .day-card {
            background: var(--bg-secondary); border: 1px solid var(--border);
            border-radius: 14px; margin-bottom: 14px; overflow: hidden;
            transition: all 0.3s;
        }
        .day-card.today { border-color: var(--accent); box-shadow: 0 0 20px rgba(230,57,70,0.15); }

        .day-card-header {
            padding: 14px 16px; display: flex; align-items: center; gap: 10px;
            cursor: pointer; touch-action: manipulation; min-height: 52px;
        }
        .day-card-header:active { background: rgba(255,255,255,0.02); }

        .day-date { font-size: 13px; font-weight: 700; color: var(--text-primary); min-width: 42px; }
        .day-name { font-size: 13px; color: var(--text-secondary); font-weight: 500; flex: 1; }
        .day-type-dot {
            width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
        }

        .day-status-icon { font-size: 18px; flex-shrink: 0; }

        .day-card-body {
            display: none; padding: 0 16px 16px;
            border-top: 1px solid var(--border);
            animation: slideDown 0.25s ease;
        }
        .day-card.open .day-card-body { display: block; }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Planned workout */
        .planned-label {
            font-size: 11px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.5px; color: var(--text-muted); margin: 14px 0 8px;
        }
        .planned-workout {
            background: var(--bg-tertiary); border-radius: 10px; padding: 12px;
            font-size: 13px; line-height: 1.6; color: var(--text-secondary);
        }
        .planned-workout strong { color: var(--text-primary); }

        /* Status buttons */
        .status-group { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }

        .status-btn {
            flex: 1; min-width: 0; padding: 10px 6px; border-radius: 10px;
            border: 1px solid var(--border); background: var(--bg-tertiary);
            color: var(--text-secondary); font-size: 12px; font-weight: 600;
            cursor: pointer; transition: all 0.2s; text-align: center;
            touch-action: manipulation;
        }
        .status-btn:active { transform: scale(0.97); }
        .status-btn .status-emoji { font-size: 18px; display: block; margin-bottom: 4px; }

        .status-btn.selected-done {
            background: rgba(34,201,128,0.2); border-color: var(--accent-secondary);
            color: var(--accent-secondary);
        }
        .status-btn.selected-replaced {
            background: rgba(240,165,0,0.2); border-color: var(--accent-warn);
            color: var(--accent-warn);
        }
        .status-btn.selected-skipped {
            background: rgba(230,57,70,0.2); border-color: var(--accent);
            color: var(--accent);
        }

        /* Replacement input */
        .replacement-section {
            display: none; margin-top: 12px;
            animation: slideDown 0.2s ease;
        }
        .replacement-section.visible { display: block; }

        /* Hyrox detail section */
        .hyrox-detail-section {
            margin-top: 12px; animation: slideDown 0.2s ease;
        }
        .hyrox-detail-section .hyrox-badge {
            display: inline-flex; align-items: center; gap: 6px;
            font-size: 11px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.5px; color: #f0a500;
            background: rgba(240,165,0,0.12); padding: 4px 10px;
            border-radius: 8px; margin-bottom: 8px;
        }
        .hyrox-input {
            width: 100%; padding: 10px 12px; border-radius: 10px;
            border: 1px solid rgba(240,165,0,0.25); background: var(--bg-tertiary);
            color: var(--text-primary); font-size: 14px; font-family: inherit;
            resize: vertical; min-height: 90px; outline: none;
            transition: border-color 0.2s;
        }
        .hyrox-input:focus { border-color: #f0a500; }
        .hyrox-input::placeholder { color: var(--text-muted); }

        .input-label {
            font-size: 11px; font-weight: 700; text-transform: uppercase;
            letter-spacing: 0.5px; color: var(--text-muted); margin-bottom: 6px;
        }

        .text-input {
            width: 100%; padding: 10px 12px; border-radius: 10px;
            border: 1px solid var(--border-light); background: var(--bg-tertiary);
            color: var(--text-primary); font-size: 14px; font-family: inherit;
            resize: vertical; min-height: 44px; outline: none;
            transition: border-color 0.2s;
        }
        .text-input:focus { border-color: var(--accent); }
        .text-input::placeholder { color: var(--text-muted); }

        /* Comments */
        .comment-section { margin-top: 12px; }
        .comment-input {
            width: 100%; padding: 10px 12px; border-radius: 10px;
            border: 1px solid var(--border-light); background: var(--bg-tertiary);
            color: var(--text-primary); font-size: 14px; font-family: inherit;
            resize: vertical; min-height: 70px; outline: none;
            transition: border-color 0.2s;
        }
        .comment-input:focus { border-color: var(--accent-secondary); }
        .comment-input::placeholder { color: var(--text-muted); }

        /* Tags */
        .tag-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
        .tag {
            padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 600;
            cursor: pointer; transition: all 0.2s; touch-action: manipulation;
            border: 1px solid var(--border);
        }
        .tag:active { transform: scale(0.95); }
        .tag.active { border-color: currentColor; }
        .tag-fatigue { color: var(--accent); background: rgba(230,57,70,0.1); }
        .tag-fatigue.active { background: rgba(230,57,70,0.25); }
        .tag-blessure { color: #ff6b6b; background: rgba(255,107,107,0.1); }
        .tag-blessure.active { background: rgba(255,107,107,0.25); }
        .tag-top { color: var(--accent-secondary); background: rgba(34,201,128,0.1); }
        .tag-top.active { background: rgba(34,201,128,0.25); }
        .tag-sommeil { color: #4a9eff; background: rgba(74,158,255,0.1); }
        .tag-sommeil.active { background: rgba(74,158,255,0.25); }
        .tag-stress { color: #9b59b6; background: rgba(155,89,182,0.1); }
        .tag-stress.active { background: rgba(155,89,182,0.25); }

        /* RPE Slider */
        .rpe-section { margin-top: 14px; }
        .rpe-row { display: flex; align-items: center; gap: 10px; margin-top: 6px; }
        .rpe-slider {
            flex: 1; -webkit-appearance: none; appearance: none;
            height: 6px; border-radius: 3px;
            background: linear-gradient(to right, var(--accent-secondary), var(--accent-warn), var(--accent));
            outline: none;
        }
        .rpe-slider::-webkit-slider-thumb {
            -webkit-appearance: none; appearance: none;
            width: 24px; height: 24px; border-radius: 50%;
            background: var(--text-primary); cursor: pointer;
            border: 2px solid var(--bg-primary);
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .rpe-value {
            font-size: 20px; font-weight: 700; min-width: 36px; text-align: center;
            color: var(--accent-secondary);
        }
        .rpe-label { font-size: 11px; color: var(--text-muted); }

        /* Stats summary */
        .stats-bar {
            display: flex; gap: 8px; padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            overflow-x: auto; -webkit-overflow-scrolling: touch;
        }
        .stat-chip {
            padding: 6px 12px; border-radius: 10px; background: var(--bg-secondary);
            border: 1px solid var(--border); font-size: 12px; font-weight: 600;
            white-space: nowrap; flex-shrink: 0;
        }
        .stat-chip .stat-num { color: var(--accent); }
        .stat-chip .stat-label { color: var(--text-secondary); }

        /* Export button */
        .export-btn {
            display: block; width: 100%; padding: 14px; margin-top: 16px;
            border-radius: 12px; border: 1px solid var(--border);
            background: var(--bg-secondary); color: var(--text-secondary);
            font-size: 14px; font-weight: 600; cursor: pointer;
            text-align: center; transition: all 0.2s;
        }
        .export-btn:active { background: var(--bg-tertiary); }

        /* Back to plan link */
        .back-link {
            display: inline-flex; align-items: center; gap: 6px;
            color: var(--accent); text-decoration: none; font-size: 13px; font-weight: 600;
        }

        /* Responsive */
        @media (max-width: 360px) {
            .header-title { font-size: 20px; }
            .status-btn { padding: 8px 4px; font-size: 11px; }
        }
    </style>
</head>

const joursFR = ['Dim', 'Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam'];
const joursFullFR = ['Dimanche', 'Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi'];
const moisFR = ['janv', 'fév', 'mars', 'avril', 'mai', 'juin', 'juil', 'août', 'sept', 'oct', 'nov', 'déc'];

// ===== Date helpers =====
const START_DATE = new Date(2026, 2, 30); // March 30, 2026 (Monday)
const END_DATE = new Date(2026, 9, 4);    // October 4, 2026 (end of Jablines-Estérel cycle)

function dateKey(d) {
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

function parseDate(key) {
    const [y,m,d] = key.split('-').map(Number);
    return new Date(y, m-1, d);
}

function isSameDay(a, b) {
    return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
}

function getPhaseForDate(d) {
    for (const p of trainingPlan.phases) {
        const start = parseDate(p.start);
        const end = parseDate(p.end);
        end.setHours(23,59,59);
        if (d >= start && d <= end) return p.num;
    }
    return 1;
}

function getPlannedWorkout(d) {
    const dow = d.getDay();
    const dayPlan = trainingPlan.days[dow];
    if (!dayPlan) return null;
    const phase = getPhaseForDate(d);
    return {
        label: dayPlan.label,
        type: dayPlan.type,
        color: dayPlan.color,
        icon: dayPlan.icon,
        detail: dayPlan.phases[phase] || ''
    };
}

// Generate all training days
function getAllDays() {
    const days = [];
    const d = new Date(START_DATE);
    while (d <= END_DATE) {
        days.push(new Date(d));
        d.setDate(d.getDate() + 1);
    }
    return days;
}

// Group into weeks (Mon-Sun)
function getWeeks() {
    const days = getAllDays();
    const weeks = [];
    let currentWeek = [];
    for (const d of days) {
        if (d.getDay() === 1 && currentWeek.length > 0) {
            weeks.push(currentWeek);
            currentWeek = [];
        }
        currentWeek.push(d);
    }
    if (currentWeek.length > 0) weeks.push(currentWeek);
    return weeks;
}

// ===== Storage =====
const STORAGE_KEY = 'spartan-journal-data';

function loadData() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : {};
    } catch { return {}; }
}

function saveData(data) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

function getDayData(key) {
    const data = loadData();
    return data[key] || { status: null, replacement: '', comment: '', tags: [], rpe: 0, hyroxDetail: '' };
}

function setDayData(key, dayData) {
    const data = loadData();
    data[key] = dayData;
    saveData(data);
}

// ===== State =====
let currentWeekIdx = 0;
let openDayKey = null;
const weeks = getWeeks();

// Determine current week
(function() {
    const today = new Date();
    for (let i = 0; i < weeks.length; i++) {
        const weekStart = weeks[i][0];
        const weekEnd = weeks[i][weeks[i].length - 1];
        if (today >= weekStart && today <= weekEnd) { currentWeekIdx = i; return; }
    }
    // Default to first incomplete week or last week
    currentWeekIdx = 0;
})();

// ===== Render =====
function renderWeekNav() {
    const nav = document.getElementById('weekNav');
    const data = loadData();

    nav.innerHTML = weeks.map((week, idx) => {
        const startD = week[0];
        const endD = week[week.length - 1];
        const phase = getPhaseForDate(startD);
        const label = `S${idx+1}`;

        // Count completed
        let done = 0, total = week.length;
        week.forEach(d => {
            const dd = data[dateKey(d)];
            if (dd && dd.status) done++;
        });
        const progress = done > 0 ? ` ${done}/${total}` : '';

        return `<div class="week-pill ${idx === currentWeekIdx ? 'active' : ''}" onclick="selectWeek(${idx})">
            ${label} · P${phase}<span class="week-progress">${progress}</span>
        </div>`;
    }).join('');
}

function renderStats() {
    const data = loadData();
    let done = 0, replaced = 0, skipped = 0, total = 0;
    const allDays = getAllDays();
    const today = new Date();

    allDays.forEach(d => {
        if (d > today) return;
        total++;
        const dd = data[dateKey(d)];
        if (dd) {
            if (dd.status === 'done') done++;
            else if (dd.status === 'replaced') replaced++;
            else if (dd.status === 'skipped') skipped++;
        }
    });

    const adherence = total > 0 ? Math.round(((done + replaced) / total) * 100) : 0;

    document.getElementById('statsBar').innerHTML = `
        <div class="stat-chip"><span class="stat-num">${done}</span> <span class="stat-label">faites</span></div>
        <div class="stat-chip"><span class="stat-num">${replaced}</span> <span class="stat-label">rempl.</span></div>
        <div class="stat-chip"><span class="stat-num">${skipped}</span> <span class="stat-label">manquées</span></div>
        <div class="stat-chip"><span class="stat-num">${adherence}%</span> <span class="stat-label">adhérence</span></div>
    `;
}

function statusIcon(status) {
    if (status === 'done') return '✅';
    if (status === 'replaced') return '🔄';
    if (status === 'skipped') return '❌';
    return '○';
}

                <div class="status-group">
                    <button class="status-btn ${dd.status === 'done' ? 'selected-done' : ''}" onclick="setStatus('${key}', 'done')">
                        <span class="status-emoji">✅</span>Faite
                    </button>
                    <button class="status-btn ${dd.status === 'replaced' ? 'selected-replaced' : ''}" onclick="setStatus('${key}', 'replaced')">
                        <span class="status-emoji">🔄</span>Remplacée
                    </button>
                    <button class="status-btn ${dd.status === 'skipped' ? 'selected-skipped' : ''}" onclick="setStatus('${key}', 'skipped')">
                        <span class="status-emoji">❌</span>Pas de séance
                    </button>
                </div>

                <div class="replacement-section ${dd.status === 'replaced' ? 'visible' : ''}" id="repl-${key}">
                    <div class="input-label">Séance de remplacement</div>
                    <textarea class="text-input" placeholder="Décris la séance effectuée..." oninput="updateField('${key}', 'replacement', this.value)">${dd.replacement || ''}</textarea>
                </div>

                <div class="rpe-section" ${dd.status === 'done' || dd.status === 'replaced' ? '' : 'style="display:none"'} id="rpe-${key}">
                    <div class="input-label">Intensité ressentie (RPE)</div>
                    <div class="rpe-row">
                        <input type="range" class="rpe-slider" min="0" max="10" step="1" value="${dd.rpe || 0}"
                            oninput="updateRPE('${key}', this.value)">
                        <div class="rpe-value" id="rpe-val-${key}" style="color:${rpeColor(dd.rpe || 0)}">${dd.rpe || 0}</div>
                    </div>
                    <div class="rpe-label">${rpeLabel(dd.rpe || 0)}</div>
                </div>

                <div class="comment-section">
                    <div class="input-label">Commentaires</div>
                    <div class="tag-row">
                        <span class="tag tag-top ${(dd.tags||[]).includes('top') ? 'active' : ''}" onclick="toggleTag('${key}', 'top')">🔥 Top forme</span>
                        <span class="tag tag-fatigue ${(dd.tags||[]).includes('fatigue') ? 'active' : ''}" onclick="toggleTag('${key}', 'fatigue')">😴 Fatigue</span>
                        <span class="tag tag-blessure ${(dd.tags||[]).includes('blessure') ? 'active' : ''}" onclick="toggleTag('${key}', 'blessure')">🤕 Douleur</span>
                        <span class="tag tag-sommeil ${(dd.tags||[]).includes('sommeil') ? 'active' : ''}" onclick="toggleTag('${key}', 'sommeil')">😶‍🌫️ Mal dormi</span>
                        <span class="tag tag-stress ${(dd.tags||[]).includes('stress') ? 'active' : ''}" onclick="toggleTag('${key}', 'stress')">🧠 Stress</span>
                    </div>
                    <textarea class="comment-input" placeholder="Sensations, blessures, ajustements..." oninput="updateField('${key}', 'comment', this.value)">${dd.comment || ''}</textarea>
                </div>
            </div>
        </div>`;
    });

    html += `<button class="export-btn" onclick="exportData()">📤 Exporter le journal (JSON)</button>`;

    container.innerHTML = html;
}

function rpeColor(v) {
    if (v <= 3) return '#22c980';
    if (v <= 6) return '#f0a500';
    return '#e63946';
}

function rpeLabel(v) {
    const labels = ['Repos', 'Très facile', 'Facile', 'Modéré', 'Assez dur', 'Dur', 'Difficile', 'Très difficile', 'Extrême', 'Max', 'Limite'];
    return labels[v] || '';
}

// ===== Actions =====
function selectWeek(idx) {
    currentWeekIdx = idx;
    openDayKey = null;
    renderWeekNav();
    renderContent();
    renderStats();
}

function toggleDay(key) {
    openDayKey = openDayKey === key ? null : key;
    renderContent();
    // Scroll to card
    if (openDayKey) {
        setTimeout(() => {
            const el = document.getElementById('card-' + key);
            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 50);
    }
}

function setStatus(key, status) {
    const dd = getDayData(key);
    // Toggle off if same
    dd.status = dd.status === status ? null : status;
    setDayData(key, dd);
    renderContent();
    renderWeekNav();
    renderStats();
}

function updateField(key, field, value) {
    const dd = getDayData(key);
    dd[field] = value;
    setDayData(key, dd);
}

function updateRPE(key, value) {
    const dd = getDayData(key);
    dd.rpe = parseInt(value);
    setDayData(key, dd);
    const el = document.getElementById('rpe-val-' + key);
    if (el) {
        el.textContent = value;
        el.style.color = rpeColor(value);
    }
    // Update label
    const rpeSection = document.getElementById('rpe-' + key);
    if (rpeSection) {
        const lbl = rpeSection.querySelector('.rpe-label');
        if (lbl) lbl.textContent = rpeLabel(parseInt(value));
    }
}

function toggleTag(key, tag) {
    const dd = getDayData(key);
    if (!dd.tags) dd.tags = [];
    const idx = dd.tags.indexOf(tag);
    if (idx === -1) dd.tags.push(tag);
    else dd.tags.splice(idx, 1);
    setDayData(key, dd);
    renderContent();
}

function exportData() {
    const data = loadData();
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'spartan-journal-' + dateKey(new Date()) + '.json';
    a.click();
    URL.revokeObjectURL(url);
}

// ===== Init =====
function init() {
    renderWeekNav();
    renderStats();
    renderContent();

    // Auto-open today
    const today = new Date();
    const key = dateKey(today);
    const allDays = getAllDays();
    if (allDays.some(d => isSameDay(d, today))) {
        openDayKey = key;
        renderContent();
        setTimeout(() => {
            const el = document.getElementById('card-' + key);
            if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 100);
    }
}

if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
} else {
    init();
}
</script>
</body>
</html>
